<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Biblioteca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --stone-1:#332741;
    --stone-2:#402f52;
    --stone-3:#241a30;
    --wood-dark:#5c3a52;
    --wood-mid:#8a5a78;
    --wood-light:#b481a0;
    --wood-grain:#402c3c;
    --brass:#e3aecb;
    --brass-light:#f6d9ea;
    --brass-dark:#b87fa3;
    --interior-bg-1:#2a1f3d;
    --interior-bg-2:#3d2c52;
    --shelf-wood:#5c3f5c;
    --shelf-wood-dark:#402a40;
    --parchment:#faf0ee;
    --parchment-2:#f0dde6;
    --ink:#3d2a45;
    --ink-soft:#6b5470;
    --glow:#e8b8e0;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--stone-3);
    font-family:'Lora',serif;
  }

  .scene{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
  }

  /* ---------- INTERIOR (bookshelf room) ---------- */
  .interior{
    position:absolute;
    inset:0;
    background:
      radial-gradient(ellipse 60% 50% at 50% 38%, rgba(232,184,224,0.22), transparent 60%),
      radial-gradient(ellipse 50% 40% at 20% 70%, rgba(126,168,196,0.12), transparent 65%),
      linear-gradient(180deg, var(--interior-bg-2) 0%, var(--interior-bg-1) 60%, #1a1226 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4vh 4vw;
  }

  .shelf-unit{
    width:min(1450px,96vw);
    max-height: 80vh;
    margin-top: 6vh; 
    overflow-y: auto; 
    display:flex;
    flex-direction:column;
    gap:0;
    box-shadow:0 40px 100px rgba(0,0,0,0.6);
    opacity:0;
    transform:translateY(18px) scale(0.98);
    transition:opacity 1.1s ease, transform 1.1s ease;
    transition-delay:0.35s;
    /* Barra di scorrimento verticale */
    scrollbar-width: thin;
    scrollbar-color: var(--wood-mid) rgba(0,0,0,0.2);
  }
  .shelf-unit::-webkit-scrollbar { width: 6px; }
  .shelf-unit::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
  .shelf-unit::-webkit-scrollbar-thumb { background: var(--wood-mid); border-radius: 4px; }

  .scene.opened .shelf-unit{
    opacity:1;
    transform:translateY(0) scale(1);
  }

  .shelf-row{
    background:linear-gradient(180deg, var(--shelf-wood) 0%, var(--shelf-wood-dark) 100%);
    border-top:6px solid var(--wood-light);
    border-bottom:10px solid var(--wood-grain);
    padding:0 30px;
    display:flex;
    align-items:flex-end;
    gap:8px;
    height:clamp(150px, 20vw, 210px);
    position:relative;
    box-shadow: inset 0 10px 18px rgba(0,0,0,0.45);
    /* Permette lo scorrimento orizzontale su mobile senza mostrare la barra */
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none; 
    -webkit-overflow-scrolling: touch;
  }
  .shelf-row::-webkit-scrollbar { display: none; }
  
  .shelf-row::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-10px;
    height:10px;
    background:linear-gradient(180deg, rgba(0,0,0,0.5), transparent);
    pointer-events: none;
  }

  .book-spine{
    flex:0 0 auto;
    border-radius:2px 4px 4px 2px;
    box-shadow:
      inset -2px 0 0 rgba(0,0,0,0.25),
      inset 2px 0 0 rgba(255,255,255,0.06),
      0 3px 6px rgba(0,0,0,0.35);
    align-self:flex-end;
    position:relative;
    transition:transform .35s ease, box-shadow .35s ease, margin .3s ease;
  }

  .book-spine.decor{
    cursor:default;
  }

  .book-spine.special{
    cursor:pointer;
    outline:2px solid rgba(201,162,93,0.55);
    outline-offset:-2px;
  }
  .book-spine.special .title-band{
    position:absolute;
    top:10%;
    left:50%;
    transform:translateX(-50%);
    writing-mode:vertical-rl;
    text-orientation:mixed;
    color:var(--brass-light);
    font-family:'Cinzel',serif;
    font-size:clamp(10px,1vw,13px);
    letter-spacing:1px;
    white-space:nowrap;
    max-height:78%;
    overflow:hidden;
    text-shadow:0 1px 2px rgba(0,0,0,0.5);
  }
  .book-spine.special::before{
    content:"";
    position:absolute;
    top:14px; bottom:14px; left:4px; right:4px;
    border:1px solid rgba(236,209,143,0.35);
    border-radius:1px;
    pointer-events:none;
  }

  .book-spine.special:hover,
  .book-spine.special:focus-visible{
    transform:translateY(-15px) scale(1.08);
    z-index:5;
    box-shadow:
      0 18px 30px rgba(0,0,0,0.5),
      0 0 26px rgba(246,200,119,0.45);
  }

  .sign-plaque{
    position:absolute;
    top:3vh;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    opacity:0;
    transition:opacity 1s ease;
    transition-delay:0.6s;
    pointer-events:none;
    z-index: 20;
    width: 100%;
  }
  .scene.opened .sign-plaque{opacity:1;}
  
  .close-library{
    position:absolute;
    top:2vh;
    right:4vw;
    width:44px;
    height:44px;
    border:none;
    border-radius:50%;
    background:rgba(20,16,12,.6);
    color:#fff;
    font-size:28px;
    cursor:pointer;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .close-library:hover{transform:scale(1.08);background:rgba(20,16,12,.9);}
  
  .sign-plaque .eyebrow{
    display:block;
    font-family:'Lora',serif;
    font-style:italic;
    font-size:clamp(11px, 1.5vw, 13px);
    letter-spacing:3px;
    color:var(--brass-light);
    opacity:0.7;
    margin-bottom:2px;
  }
  .sign-plaque h1{
    margin:0;
    font-family:'Cinzel',serif;
    font-weight:600;
    font-size:clamp(20px, 4vw, 42px);
    letter-spacing:4px;
    color:var(--brass-light);
    text-shadow:0 2px 10px rgba(0,0,0,0.6);
  }

  /* ---------- EXTERIOR (door scene) ---------- */
  .exterior{
    position:absolute;
    inset:0;
    z-index:10;
    background:
      radial-gradient(ellipse 70% 60% at 50% 30%, rgba(227,174,203,0.2), transparent 65%),
      repeating-linear-gradient(0deg, var(--stone-2) 0px, var(--stone-2) 46px, var(--stone-1) 46px, var(--stone-1) 92px),
      linear-gradient(180deg, var(--stone-1), var(--stone-3));
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity 1s ease;
    transition-delay:.5s;
  }
  .exterior::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:repeating-linear-gradient(90deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 120px);
    mix-blend-mode:multiply;
    opacity:.6;
  }
  .scene.opened .exterior{
    opacity:0;
    pointer-events:none;
  }

  .sign-exterior{
    position:absolute;
    top:9vh;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    width: 100%;
  }
  .sign-exterior .eyebrow{
    display:block;
    font-family:'Lora',serif;
    font-style:italic;
    font-size:clamp(11px, 2vw, 13px);
    letter-spacing:3px;
    color:var(--brass);
    opacity:0.75;
    margin-bottom:6px;
  }
  .sign-exterior h1{
    margin:0;
    font-family:'Cinzel',serif;
    font-weight:600;
    font-size:clamp(24px, 6vw, 46px);
    letter-spacing:5px;
    color:var(--brass-light);
    text-shadow:0 2px 14px rgba(0,0,0,0.7);
  }
  .sign-exterior .underline{
    width:min(60%, 200px);
    height:2px;
    margin:10px auto 0;
    background:linear-gradient(90deg, transparent, var(--brass), transparent);
  }

  .archway{
    position:relative;
    width:min(340px, 75vw); /* Adattato per schermi stretti */
    height:min(560px, 65vh);
    perspective:1800px;
  }
  .arch-frame{
    position:absolute;
    inset:-16px -16px -0px -16px;
    border-radius:120px 120px 6px 6px;
    background:linear-gradient(180deg, #4a4038, #2a231e);
    box-shadow:0 30px 60px rgba(0,0,0,0.6), inset 0 0 0 6px rgba(0,0,0,0.25);
  }

  .door{
    position:absolute;
    inset:0;
    border-radius:110px 110px 4px 4px;
    background:
      linear-gradient(90deg, rgba(0,0,0,0.25) 0%, transparent 8%, transparent 92%, rgba(0,0,0,0.3) 100%),
      repeating-linear-gradient(90deg, var(--wood-mid) 0px, var(--wood-mid) 34px, var(--wood-dark) 34px, var(--wood-dark) 38px),
      linear-gradient(180deg, var(--wood-light), var(--wood-dark));
    border:6px solid var(--wood-grain);
    box-shadow:0 20px 45px rgba(0,0,0,0.55), inset 0 0 40px rgba(0,0,0,0.35);
    transform-origin:left center;
    transition:transform 1.15s cubic-bezier(.61,.06,.32,1);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .door:hover{ filter:brightness(1.06); }
  .scene.opened .door{
    transform:rotateY(-108deg);
  }

  .door-panel{
    position:absolute;
    width:72%;
    border:3px solid var(--wood-grain);
    border-radius:6px;
    box-shadow:inset 0 0 12px rgba(0,0,0,0.5), inset 0 0 0 2px rgba(255,255,255,0.04);
  }
  .door-panel.top{ top:9%; height:36%; }
  .door-panel.bottom{ bottom:9%; height:40%; }

  .door-handle{
    position:absolute;
    right:10%;
    top:50%;
    transform:translateY(-50%);
    width:16px;
    height:16px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--brass-light), var(--brass) 55%, var(--brass-dark) 100%);
    box-shadow:0 2px 6px rgba(0,0,0,0.6);
  }

  .enter-hint{
    position:absolute;
    bottom:-7vh;
    left:50%;
    transform:translateX(-50%);
    font-family:'Lora',serif;
    font-style:italic;
    font-size:clamp(12px, 3vw, 14px);
    letter-spacing:1px;
    color:var(--brass);
    opacity:0.75;
    white-space:nowrap;
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:.4;}
    50%{opacity:.85;}
  }

  /* ---------- BOOK OVERLAY (open book spread) ---------- */
  .book-overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(8,9,7,0);
    pointer-events:none;
    transition:background .4s ease;
    padding:3vh 3vw;
  }
  .book-overlay.active{
    background:rgba(8,9,7,0.78);
    pointer-events:auto;
  }

  .book-spread{
    display:flex;
    width:min(920px, 94vw);
    max-height:85vh;
    background:var(--wood-grain);
    border-radius:6px;
    box-shadow:0 40px 90px rgba(0,0,0,0.6);
    transform:scale(0.86) translateY(20px);
    opacity:0;
    transition:transform .5s cubic-bezier(.2,.8,.3,1.1), opacity .4s ease;
    overflow:hidden;
  }
  .book-overlay.active .book-spread{
    transform:scale(1) translateY(0);
    opacity:1;
  }

  .page{
    flex:1 1 50%;
    background:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.25), transparent 40%),
      var(--parchment);
    padding:clamp(20px,4vw,44px);
    display:flex;
    flex-direction:column;
    position:relative;
    min-height:56vh;
  }
  .page.left{
    border-right:1px solid rgba(0,0,0,0.15);
    box-shadow:inset -14px 0 24px -18px rgba(0,0,0,0.55);
  }
  .page.right{
    box-shadow:inset 14px 0 24px -18px rgba(0,0,0,0.55);
    overflow-y:auto;
  }

  .photo-slot{
    flex:1;
    border:2px dashed var(--brass-dark);
    border-radius:4px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    color:var(--ink-soft);
    background:rgba(255,255,255,0.25);
    text-align:center;
    padding:20px;
    min-height: 200px;
  }
  .photo-slot svg{ width:44px; height:44px; opacity:0.55; }
  .photo-slot span{
    font-family:'Lora',serif;
    font-style:italic;
    font-size:13px;
    letter-spacing:.5px;
  }

  .page-book-title{
    font-family:'Cinzel',serif;
    font-size:clamp(18px,2.5vw,22px);
    letter-spacing:1px;
    color:var(--ink);
    margin:0 0 14px 0;
    border-bottom:1px solid var(--brass-dark);
    padding-bottom:10px;
  }
  .page-text{
    font-family:'Lora',serif;
    font-size:15px;
    line-height:1.75;
    color:var(--ink);
  }
  .page-text .placeholder-note{
    display:inline-block;
    margin-top:14px;
    font-style:italic;
    font-size:12.5px;
    color:var(--ink-soft);
    border-top:1px dotted var(--brass-dark);
    padding-top:8px;
  }

  .close-book{
    position:absolute;
    top:16px;
    right:16px;
    z-index:101;
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid var(--brass);
    background:rgba(20,16,12,0.55);
    color:var(--brass-light);
    font-size:18px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .2s ease, background .2s ease;
  }
  .close-book:hover{ transform:scale(1.08); background:rgba(20,16,12,0.85); }

  /* =========================================
     RESPONSIVE DESIGN (MOBILE)
     ========================================= */
  @media (max-width: 768px){
    .shelf-unit{
      width: 100vw;
      margin-top: 8vh;
      border-radius: 0;
    }
    .shelf-row{
      height: 160px;
      padding: 0 15px;
      /* Permette di "sfogliare" i libri scorrendo col dito */
      scroll-snap-type: x proximity;
    }
    .book-spine {
      scroll-snap-align: center;
    }
    .book-spine.special .title-band{
      font-size: 11px;
    }
    .close-library {
      top: 15px;
      right: 15px;
      width: 38px;
      height: 38px;
      font-size: 24px;
    }
    
    /* Disposizione del libro su mobile */
    .book-spread{ 
      flex-direction:column; 
      overflow-y:auto; 
      width: 92vw;
      max-height: 90vh;
    }
    .page{ 
      min-height:auto; 
      padding: 24px 20px;
    }
    .page.left{ 
      border-right:none; 
      border-bottom:1px solid rgba(0,0,0,0.15); 
      box-shadow:none; 
    }
    .page.right{ 
      box-shadow:none; 
      overflow-y:visible; 
    }
    .close-book{
      top: 10px;
      right: 10px;
      background:rgba(20,16,12,0.85); /* Più scuro su mobile per visibilità */
    }
  }

  @media (prefers-reduced-motion: reduce){
    .door, .exterior, .shelf-unit, .sign-plaque, .book-spine, .book-spread{
      transition:none !important;
      animation:none !important;
    }
  }
</style>
</head>
<body>

<div class="scene" id="scene">
  <div class="interior">
    <button class="close-library" id="closeLibrary" aria-label="Chiudi libreria">×</button>
    <div class="sign-plaque">
      <span class="eyebrow">sala di lettura</span>
      <h1>I miei progetti</h1>
    </div>
    <div class="shelf-unit" id="shelfUnit"></div>
  </div>

  <div class="exterior" id="exterior">
    <div class="sign-exterior">
      <span class="eyebrow">benvenuto in</span>
      <h1 id="signText">BIBLIOTECA</h1>
      <div class="underline"></div>
    </div>
    <div class="archway">
      <div class="arch-frame"></div>
      <div class="door" id="door" role="button" tabindex="0" aria-label="Apri la porta della biblioteca">
        <div class="door-panel top"></div>
        <div class="door-panel bottom"></div>
        <div class="door-handle"></div>
      </div>
    </div>
    <div class="enter-hint">clicca la porta per entrare</div>
  </div>
</div>

<div class="book-overlay" id="bookOverlay">
  <button class="close-book" id="closeBook" aria-label="Chiudi libro">×</button>
  <div class="book-spread">
    <div class="page left">
      <div class="photo-slot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <circle cx="8.5" cy="10" r="1.6"/>
          <path d="M21 17l-6-5-4 3.5-2-1.8L3 17"/>
        </svg>
        <span id="pagePhotoLabel">Foto da aggiungere</span>
      </div>
    </div>
    <div class="page right">
      <h2 class="page-book-title" id="pageTitle">Titolo del progetto</h2>
      <div class="page-text">
        <p id="pageText">Questo è un testo segnaposto: qui potrai raccontare il progetto, il contesto e i risultati ottenuti.</p>
        <span class="placeholder-note">Testo di esempio — modificabile nel codice</span>
      </div>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   CONTENUTI DA PERSONALIZZARE
   ========================================================================= */

const specialBooks = [
  {
    id: 1,
    title: "Progetto Uno",
    color: "#9b7cc4",
    image: null, 
    text: "Testo segnaposto per il primo progetto: descrivi qui di cosa si tratta, gli strumenti usati e il tuo ruolo."
  },
  {
    id: 2,
    title: "Progetto Due",
    color: "#d98bab",
    image: null,
    text: "Testo segnaposto per il secondo progetto: racconta la storia dietro al lavoro e cosa lo rende speciale."
  },
  {
    id: 3,
    title: "Progetto Tre",
    color: "#7ea8c9",
    image: null,
    text: "Testo segnaposto per il terzo progetto: aggiungi dettagli, link o risultati raggiunti."
  },
  {
    id: 4,
    title: "Progetto Quattro",
    color: "#c9a1d4",
    image: null,
    text: "Testo segnaposto per il quarto progetto: qui puoi inserire una breve descrizione finale."
  },
  {
    id: 5,
    title: "Progetto Cinque",
    color: "#e8a6c0",
    image: null,
    text: "Testo segnaposto per il quinto progetto: altre esperienze e sfide superate."
  },
  {
    id: 6,
    title: "Progetto Sei",
    color: "#8ab4d9",
    image: null,
    text: "Testo segnaposto per il sesto progetto: metti in evidenza un aneddoto particolare."
  },
  {
    id: 7,
    title: "Progetto Sette",
    color: "#b48ac9",
    image: null,
    text: "Testo segnaposto per il settimo progetto: un'ottima conclusione per il tuo portfolio."
  }
];

const decorColors = ["#9b7cc4","#d98bab","#7ea8c9","#c9a1d4","#e8a6c0","#8ab4d9","#b48ac9","#e0b0d0"];

function buildShelves(){
  const shelfUnit = document.getElementById('shelfUnit');
  const rows = 3;
  let specialIndex = 0;

  const specialSlotsByRow = [
    [2, 6, 11], 
    [4, 9],     
    [3, 8]      
  ];

  for(let r = 0; r < rows; r++){
    const row = document.createElement('div');
    row.className = 'shelf-row';

    const booksPerRow = 12 + Math.floor(Math.random() * 4);
    const specialSlotsThisRow = specialSlotsByRow[r] || [];

    for(let i = 0; i < booksPerRow; i++){
      const spine = document.createElement('div');
      const isSpecialSlot = specialSlotsThisRow.includes(i) && specialIndex < specialBooks.length;

      const width = isSpecialSlot ? 70 : (42 + Math.round(Math.random()*28));
      const height = isSpecialSlot ? '98%' : (78 + Math.round(Math.random()*18)) + '%';

      spine.style.width = width + 'px';
      spine.style.height = height;

      // Crea lo spazio vuoto in modo casuale
      if (!isSpecialSlot && Math.random() > 0.65 && i > 0) {
        spine.style.marginLeft = (25 + Math.random() * 45) + 'px';
      }

      if(isSpecialSlot){
        const book = specialBooks[specialIndex];
        spine.className = 'book-spine special';
        spine.style.background = `linear-gradient(180deg, ${book.color}, ${shade(book.color,-18)})`;
        spine.dataset.bookId = book.id;
        spine.setAttribute('tabindex','0');
        spine.setAttribute('role','button');
        spine.setAttribute('aria-label', 'Apri il libro: ' + book.title);

        const band = document.createElement('span');
        band.className = 'title-band';
        band.textContent = book.title;
        spine.appendChild(band);

        spine.addEventListener('click', () => openBook(book.id));
        spine.addEventListener('keypress', (e) => { if(e.key === 'Enter') openBook(book.id); });

        specialIndex++;
      } else {
        spine.className = 'book-spine decor';
        const c = decorColors[Math.floor(Math.random()*decorColors.length)];
        spine.style.background = `linear-gradient(180deg, ${c}, ${shade(c,-15)})`;
      }

      row.appendChild(spine);
    }
    
    // Aggiunge un blocco invisibile alla fine per assicurare un margine finale quando si scorre da telefono
    const spacer = document.createElement('div');
    spacer.style.flex = "0 0 20px";
    row.appendChild(spacer);

    shelfUnit.appendChild(row);
  }
}

function shade(hex, percent){
  const num = parseInt(hex.replace('#',''),16);
  let r = (num >> 16) + percent;
  let g = ((num >> 8) & 0x00FF) + percent;
  let b = (num & 0x0000FF) + percent;
  r = Math.min(255, Math.max(0,r));
  g = Math.min(255, Math.max(0,g));
  b = Math.min(255, Math.max(0,b));
  return "#" + (0x1000000 + r*0x10000 + g*0x100 + b).toString(16).slice(1);
}

function openBook(id){
  const book = specialBooks.find(b => b.id === id);
  if(!book) return;

  document.getElementById('pageTitle').textContent = book.title;
  document.getElementById('pageText').textContent = book.text;

  const photoSlot = document.querySelector('.photo-slot');
  const label = document.getElementById('pagePhotoLabel');
  const existingImg = photoSlot.querySelector('img');
  if(existingImg) existingImg.remove();

  if(book.image){
    label.style.display = 'none';
    photoSlot.querySelector('svg').style.display = 'none';
    const img = document.createElement('img');
    img.src = book.image;
    img.alt = book.title;
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:2px;';
    photoSlot.appendChild(img);
  } else {
    label.style.display = 'block';
    label.textContent = 'Foto da aggiungere';
    photoSlot.querySelector('svg').style.display = 'block';
  }

  document.getElementById('closeLibrary').style.display='none';
  document.getElementById('bookOverlay').classList.add('active');
}

function closeBook(){
  document.getElementById('bookOverlay').classList.remove('active');
  document.getElementById('closeLibrary').style.display='flex';
}

// --- interazioni principali ---
const scene = document.getElementById('scene');
const door = document.getElementById('door');

function openDoor(){scene.classList.add('opened');}
function closeDoor(){scene.classList.remove('opened');}
door.addEventListener('click', openDoor);
door.addEventListener('keypress', (e) => { if(e.key === 'Enter') openDoor(); });

document.getElementById('closeLibrary').addEventListener('click', closeDoor);
document.getElementById('closeBook').addEventListener('click', closeBook);
document.getElementById('bookOverlay').addEventListener('click', (e) => {
  if(e.target.id === 'bookOverlay') closeBook();
});
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeBook(); });

buildShelves();
</script>
